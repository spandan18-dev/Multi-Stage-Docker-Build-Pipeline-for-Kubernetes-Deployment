name: Build Push Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t spandan735/blog-app:${{ github.sha }} \
          ./Backend

      - name: Push Docker Image
        run: |
          docker push spandan735/blog-app:${{ github.sha }}

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/blog-api \
          blog-api=spandan735/blog-app:${{ github.sha }} \
          -n blog-app

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/blog-api -n blog-app