name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t spandan735/blog-app:latest ./Backend

      - name: Push Docker Image
        run: |
          docker push spandan735/blog-app:latest

      
      - name: Update Deployment Image
        run: |
          kubectl set image deployment/blog-api \
          blog-api=spandan735/blog-app:${{ github.sha }} \
          -n blog-app

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/blog-api -n blog-app